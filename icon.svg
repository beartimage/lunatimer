<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- warm paper canvas, same palette as the app -->
    <radialGradient id="paper" cx="0.5" cy="0.30" r="0.95">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="0.55" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#efe9dc"/>
    </radialGradient>
    <!-- the app's gold gradient (#b58d3c / #e6cd82 / #8a6b23) -->
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b58d3c"/>
      <stop offset="0.5" stop-color="#e6cd82"/>
      <stop offset="1" stop-color="#8a6b23"/>
    </linearGradient>
    <!-- crescent: gold disc with an offset bite taken out -->
    <mask id="moon">
      <rect width="512" height="512" fill="black"/>
      <circle cx="248" cy="258" r="88" fill="white"/>
      <circle cx="292" cy="234" r="76" fill="black"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#423a24" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded-square paper tile -->
  <rect width="512" height="512" rx="112" fill="url(#paper)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#b58d3c" stroke-opacity="0.18" stroke-width="2"/>

  <!-- faint full guide ring -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#b58d3c" stroke-opacity="0.28" stroke-width="3"/>
  <!-- gold progress arc (roughly 3/4 turn) -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#gold)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="773 258" transform="rotate(-90 256 256)"
          filter="url(#soft)"/>
  <!-- travelling knob at the arc head (top) -->
  <circle cx="256" cy="92" r="15" fill="#fbf8f0" stroke="url(#gold)" stroke-width="7" filter="url(#soft)"/>

  <!-- crescent moon (luna) -->
  <circle cx="248" cy="258" r="88" fill="url(#gold)" mask="url(#moon)" filter="url(#soft)"/>
</svg>
